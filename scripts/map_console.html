<!doctype html><meta charset="utf-8"><title>底盘地图与目标点</title>
<style>body{margin:0;background:#101923;color:#e1eaf4;font:16px sans-serif}header{padding:18px 24px}h2{margin:0 0 10px}button{padding:8px 14px;margin-right:10px}#status{padding:10px 0;color:#ffd48a}canvas{display:block;width:100%;height:70vh}small{color:#b8c8d8}#error{color:#ff9292}</style>
<header><h2>底盘地图与目标点</h2><button id="follow">跟随 / 全图</button>缩放 <input id="zoom" type="range" min="15" max="180" value="60"><button id="send" disabled>发送选定目标</button><button id="cancel" disabled>取消导航</button><div id="status">等待地图与定位</div><div id="error"></div><small>蓝色轮廓：当前底盘；橙色：优化轨迹；绿色：规划路径。导航模式下，在地图上按住并拖动，选择目标位置与朝向，再点击发送。CAD 与实车的安装关系尚待现场核对。</small></header><canvas id="map"></canvas>
<script>
const c=document.querySelector('#map'),ctx=c.getContext('2d');let data=null,follow=true,selected=null,dragging=false,view=null,lastImage='',mapImage=null;
const status=document.querySelector('#status'),err=document.querySelector('#error'),send=document.querySelector('#send'),cancel=document.querySelector('#cancel');
document.querySelector('#follow').onclick=()=>{follow=!follow;draw()};document.querySelector('#zoom').oninput=draw;
function world(e){const b=c.getBoundingClientRect();return [view.center[0]+(e.clientX-b.left-b.width/2)/view.s,view.center[1]-(e.clientY-b.top-b.height/2)/view.s]}
c.onpointerdown=e=>{if(!data?.allow_goals||!view)return;selected=[...world(e),0];dragging=true;c.setPointerCapture(e.pointerId);draw()};c.onpointermove=e=>{if(!dragging)return;let p=world(e);selected[2]=Math.atan2(p[1]-selected[1],p[0]-selected[0]);draw()};c.onpointerup=()=>{dragging=false;draw()};
function draw(){if(!data)return;const d=data,b=c.getBoundingClientRect(),w=b.width,h=b.height;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);let center=d.pose?d.pose.slice(0,2):[0,0];if(!follow&&d.grid)center=[d.grid.origin[0]+d.grid.width*d.grid.resolution/2,d.grid.origin[1]+d.grid.height*d.grid.resolution/2];else if(!follow&&d.points.length)center=[0,1].map(i=>(Math.min(...d.points.map(p=>p[i]))+Math.max(...d.points.map(p=>p[i])))/2);const s=+document.querySelector('#zoom').value;view={center,s};const xy=p=>[w/2+(p[0]-center[0])*s,h/2-(p[1]-center[1])*s];
if(d.grid&&mapImage){let g=d.grid,p=xy([g.origin[0],g.origin[1]+g.height*g.resolution]);ctx.imageSmoothingEnabled=false;ctx.drawImage(mapImage,...p,g.width*g.resolution*s,g.height*g.resolution*s)}
ctx.strokeStyle='#385064';ctx.lineWidth=.5;for(let i=-Math.ceil(w/s);i<=Math.ceil(w/s);i++){let x=xy([Math.floor(center[0])+i,0])[0];ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let i=-Math.ceil(h/s);i<=Math.ceil(h/s);i++){let y=xy([0,Math.floor(center[1])+i])[1];ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
ctx.fillStyle='#5ec4c7';for(const p of d.points){let a=xy(p);ctx.fillRect(a[0],a[1],1.5,1.5)}function line(ps,color){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ps.forEach((p,i)=>{let a=xy(p);i?ctx.lineTo(...a):ctx.moveTo(...a)});ctx.stroke()}line(d.path,'#ffb454');line(d.plan,'#59d87b');
function body(p,color){let cs=Math.cos(p[2]),sn=Math.sin(p[2]);let ps=d.footprint.map(v=>[p[0]+cs*v[0]-sn*v[1],p[1]+sn*v[0]+cs*v[1]]);ps.push(ps[0]);line(ps,color);line([[p[0],p[1]],[p[0]+.35*cs,p[1]+.35*sn]],color)}if(d.pose)body([d.pose[0],d.pose[1],d.pose[3]],d.pose_age<.5?'#4aa5ff':'#8393a4');if(selected)body(selected,'#ffda76');ctx.fillStyle='#ffffff';ctx.fillText('网格 1 m · '+d.frame,15,h-18);
send.disabled=!selected||!d.allow_goals||d.pose_age>.5;cancel.disabled=!d.allow_goals;status.textContent=(d.allow_goals?'选点导航':'只读建图')+' | '+(d.pose_age<.5?'位置实时':'位置未就绪或过期')+' | 地图更新 '+(d.map_seen?d.map_age.toFixed(1)+'秒前':'等待中')+' | '+d.goal_status+(selected?' | 目标 '+selected.slice(0,2).map(v=>v.toFixed(2)).join(', ')+' m':'');}
async function post(path,body){try{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Chassis-Token':'__TOKEN__'},body:JSON.stringify(body)});let d=await r.json();err.textContent=d.ok?'':d.error}catch(e){err.textContent='请求未确认，请检查连接与导航状态'}}send.onclick=()=>{if(selected)post('/goal',{x:selected[0],y:selected[1],yaw:selected[2]})};cancel.onclick=()=>post('/cancel',{});
async function tick(){try{const r=await fetch('/data',{cache:'no-store'});data=await r.json();if(data.grid&&data.grid.image!==lastImage){lastImage=data.grid.image;let im=new Image;im.onload=()=>{mapImage=im;draw()};im.src=lastImage}draw()}catch(e){status.textContent='连接中断，位置和地图不再更新';send.disabled=true}setTimeout(tick,500)}tick();
</script>
