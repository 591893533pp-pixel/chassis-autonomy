    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity:
    - 1.5
    - 1.5
    - 0.15
    min_velocity:
    - -1.5
    - -1.5
    - -0.15
    max_accel:
    - 1.0
    - 1.0
    - 0.2
    max_decel:
    - -1.0
    - -1.0
    - -0.2
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.3
    enable_stamped_cmd_vel: false
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /navigation/cmd_vel_safe
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.4
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # 2026-10-16 disabled (arms seen as obstacles); 2026-10-27 re-enabled: sensor_bridge removes the
    # live RK upper body (config/upper_body_filter.json) from /navigation/safety_points first.
    # Autonomous navigation keeps Stop + Slowdown; set enabled=false only for a temporary test.
    polygons:
    - Stop
    - Slowdown
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: false
    # Preserve measured XY at the centimetre-wide stop boundary; scan bins rotate returns.
    observation_sources:
    - safety_points
    safety_points:
      type: pointcloud
      topic: /navigation/safety_points
      # URDF wheel-contact ground z=-0.0163687m; retain from 0.04m above ground.
      min_height: 0.0236313
      max_height: 1.93
      source_timeout: 0.4
      enabled: true
    enable_stamped_cmd_vel: false
    # 2026-10-09: user choice. Stop = actual 0.54x0.56m footprint +0.03m (matches costmap
    # footprint+padding); Slowdown = footprint +0.15m at 30% speed. Previously Stop was a 0.5m
    # circle, which stopped the robot near walls allowed by the 0.20m inflation.
    Stop:
      type: polygon
      points: '[[0.30, 0.31], [0.30, -0.31], [-0.30, -0.31], [-0.30, 0.31]]'
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: /navigation/stop_zone
      enabled: true
    Slowdown:
      type: polygon
      points: '[[0.42, 0.43], [0.42, -0.43], [-0.42, -0.43], [-0.42, 0.43]]'
      action_type: slowdown
      slowdown_ratio: 0.3
      min_points: 3
      visualize: true
      polygon_pub_topic: /navigation/slowdown_zone
      enabled: true
